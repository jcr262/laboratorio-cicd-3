name: Pipeline de Integracion y Despliegue Continuo
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8

      - name: Ejecutar Linter
        run: flake8 . --max-line-length=100

      - name: Ejecutar Pruebas Automatizadas
        run: pytest -v

      - name: Compilar Imagen Docker de la Aplicacion
        run: |
          docker build -t mi-aplicacion-cicd:${{ github.sha }} .
          docker images
